<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobForm Autofill</title>
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div class="brand-lockup">
          <p class="eyebrow">DataLaburo tools</p>
          <h1>JobForm <span>Autofill</span></h1>
        </div>
        <span class="product-badge">Extension</span>
      </header>
      <section class="status-panel" aria-label="Estado de detección">
        <span class="status-indicator" aria-hidden="true"></span>
        <p id="status" class="status" aria-live="polite">Detectando campos…</p>
      </section>
      <button id="fill-known" class="button button-primary" type="button" disabled>Fill known fields</button>
      <section class="fields-section" aria-labelledby="detected-fields-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Autofill</p>
            <h2 id="detected-fields-title">Detected fields</h2>
          </div>
          <p id="field-summary" class="field-summary"></p>
        </div>
        <label class="field-search" for="field-search">
          <span class="visually-hidden">Search detected appearances</span>
          <input id="field-search" type="search" placeholder="Search fields, labels, IDs…" autocomplete="off" />
        </label>
        <p id="search-result" class="search-result" aria-live="polite"></p>
        <ul id="field-list" class="field-list" aria-live="polite"></ul>
      </section>
    </main>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
